# SISTR: Salmonella serovar prediction from an assembly (bin/typing_steps.py).
# Installed by deploy/setup_typing.sh into <typing root>/sistr.
#
# These typing tools each get their own env. Solved together they fail:
# SeqSero2 needs an old Python and biopython that SISTR and abricate cannot use.
name: typing_sistr
channels:
  - conda-forge
  - bioconda
dependencies:
  - sistr_cmd=1.1.3
  # sistr_cmd imports pkg_resources but its recipe does not ask for
  # setuptools, and setuptools 81 drops pkg_resources. Without this line
  # `sistr` stops at import with "No module named 'pkg_resources'".
  - setuptools<81
